name: Deploy Documentation & Archify Portal to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Verify Documentation, Three.js 3D Samples & Archify Bundle Completeness
        run: |
          set -euo pipefail
          test -f docs/site/index.html
          test -f docs/site/styles.css
          test -f docs/site/app.js
          test -f docs/site/vendor/three.min.js
          test -f docs/site/examples/three-shell.js
          test -f docs/site/examples/kids-science-fair-glider/index.html
          test -f docs/site/examples/kids-robotics-arena/index.html
          test -f docs/site/examples/advanced-hash-chain-time-travel/index.html
          test -f docs/site/examples/advanced-bmad-crew-evolution/index.html
          test -f docs/site/archify/system-overview.html
          test -f docs/site/archify/how-numberone-works-explainer.html
          test -f docs/site/archify/choreography-stage.html
          test -f docs/site/archify/code-analysis/repo.analysis.html
          test -f docs/site/archify/examples/kids-science-fair-glider-timeline.html
          test -f docs/site/archify/examples/kids-science-fair-glider-explainer.html
          test -f docs/site/archify/examples/kids-robotics-arena-sequence.html
          test -f docs/site/archify/examples/kids-robotics-arena-explainer.html
          test -f docs/site/archify/examples/advanced-hash-chain-time-travel-dataflow.html
          test -f docs/site/archify/examples/advanced-hash-chain-time-travel-explainer.html
          test -f docs/site/archify/examples/advanced-bmad-crew-evolution-workflow.html
          test -f docs/site/archify/examples/advanced-bmad-crew-evolution-explainer.html
          touch docs/site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
