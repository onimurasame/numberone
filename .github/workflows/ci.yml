name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (src + tests)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Dependency Security Audit
        run: npm audit --audit-level=high
      - name: Tarball Install Smoke Test
        run: |
          set -euo pipefail
          PACK_DIR="$(mktemp -d)"
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$PACK_DIR" "$SMOKE_DIR"' EXIT
          TGZ="$(npm pack --pack-destination "$PACK_DIR" | tail -n 1)"
          npm --prefix "$SMOKE_DIR" install --omit=dev --ignore-scripts "$PACK_DIR/$TGZ"
          "$SMOKE_DIR/node_modules/.bin/n1" --version
          "$SMOKE_DIR/node_modules/.bin/n1" --help >/dev/null
          node -e "import('$SMOKE_DIR/node_modules/numberone/dist/index.js').then(m => { if (!m.NumberOneAgent) process.exit(1); })"
      - name: Hardened Container Build & Runtime Smoke Test
        run: |
          set -euo pipefail
          docker build -t numberone-ci-verify .
          docker run --rm --read-only --tmpfs /tmp --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint id numberone-ci-verify | grep -q 'uid=1000(node)'
          docker run --rm --read-only --tmpfs /tmp --cap-drop=ALL --security-opt=no-new-privileges \
            numberone-ci-verify --version
          WS_DIR="$(mktemp -d)"
          trap 'rm -rf "$WS_DIR"' EXIT
          HOST_UG="$(id -u):$(id -g)"
          docker run --rm --user "$HOST_UG" --read-only --tmpfs /tmp --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$WS_DIR:/workspace" numberone-ci-verify attach /workspace --no-hooks --no-shims --json >/dev/null
          CID="$(docker run -d --user "$HOST_UG" --read-only --tmpfs /tmp --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$WS_DIR:/workspace" numberone-ci-verify watch --foreground --workspace /workspace)"
          sleep 1
          echo "export const live = true;" > "$WS_DIR/live.ts"
          sleep 1
          docker stop -t 5 "$CID" >/dev/null
          EXIT_CODE="$(docker inspect -f '{{.State.ExitCode}}' "$CID")"
          docker rm "$CID" >/dev/null
          test "$EXIT_CODE" -eq 0
          docker run --rm --user "$HOST_UG" --read-only --tmpfs /tmp --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$WS_DIR:/workspace" numberone-ci-verify verify --workspace /workspace --local-only --json | grep -q '"valid": true'
