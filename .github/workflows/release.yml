name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Verify Tag Matches package.json Version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install, Typecheck, Build, Test & Audit
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npm audit --audit-level=high

      - name: Pack Release Artifact & SHA-256 Checksums
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          TGZ="$(npm pack --pack-destination release-artifacts | tail -n 1)"
          (cd release-artifacts && sha256sum "$TGZ" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* \
            --title "Number One ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Publish to npm with Provenance (when NPM_TOKEN is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm publish --provenance --access public
          else
            echo "NPM_TOKEN not configured; skipping npm registry publish (GitHub Release created)."
          fi
